# MinCDC via mincatcdc (https://github.com/russellromney/mincatcdc)
# min=2048 max=14336 gives ~8.2 KiB expected chunks, matching the 8KB configs.
chunking_algo=mincdc
hashing_algo=xxhash128
output_file=./hashes_mincdc/mincdc_8kb.out
simd_mode=none
buffer_size=32768

mincdc_min_block_size=2048
mincdc_max_block_size=14336
mincdc_caterpillar=false
